name: 🐛 Bug report
description: Report a problem with a build published in this repo.
title: "[Bug]: "
labels: ["bug"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting, please search [existing issues](https://github.com/practical-inference/vllm-ampere-extended/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: markdown
  attributes:
    value: |
      ⚠️ **SECURITY WARNING:** Please review any text you paste to ensure it does not contain sensitive information such as:
      - API tokens or keys (e.g., Hugging Face tokens, OpenAI API keys)
      - Passwords or authentication credentials
      - Private URLs or endpoints
      - Personal or confidential data

      Consider redacting or replacing sensitive values with placeholders like `<YOUR_TOKEN_HERE>` when sharing configuration or code examples.
- type: dropdown
  attributes:
    label: Which build are you running?
    description: The tag or wheel version from `pip show vllm` / `python -c "import vllm; print(vllm.__version__)"`
    options:
      - Latest release
      - A nightly tag (specify below)
      - Built from source
      - Other / not sure
  validations:
    required: true
- type: dropdown
  attributes:
    label: Does the problem reproduce on an upstream vLLM release?
    description: |
      Install the matching upstream vLLM release and try your repro.
      If it reproduces there, it is an upstream bug — please report it at
      https://github.com/vllm-project/vllm/issues instead (answer "Yes, and filed upstream" below).
    options:
      - "No — only in builds from this repo"
      - "Yes, and filed upstream"
      - "Yes, not yet filed upstream"
      - "Haven't checked"
  validations:
    required: true
- type: textarea
  attributes:
    label: GPU and environment
    description: |
      GPU model, compute capability, driver version, CUDA version. For example:
      ```
      NVIDIA GeForce RTX 3090, CC 8.6, driver 595.91, CUDA 13.2
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: Minimal reproduction
    description: The smallest command or script that shows the problem.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected vs actual behavior
- type: textarea
  attributes:
    label: Relevant logs
    description: Paste logs inside triple backticks. Include the full traceback if there is one.

name: 🚀 Feature request
description: Propose an improvement to this distribution (builds, docs, tooling).
title: "[Feature]: "
labels: ["feature request"]

body:
- type: markdown
  attributes:
    value: >
      #### This repo ships validated vLLM builds — it does not fork vLLM source.

      Feature requests for **vLLM itself** (models, engine features, kernels,
      API changes) belong upstream at
      [vllm-project/vllm](https://github.com/vllm-project/vllm/issues) — they
      will reach this distribution through the nightly merge once merged there.
- type: textarea
  attributes:
    label: What would you like improved?
    description: If this is a vLLM feature, file it upstream and link the issue here only if it also affects this distribution.
  validations:
    required: true
- type: textarea
  attributes:
    label: Why is this specific to this distribution?
    description: Build tooling, release process, documentation, validation — rather than vLLM source.
  validations:
    required: true
- type: textarea
  attributes:
    label: Proposed solution

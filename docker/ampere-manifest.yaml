# Known working configs for the vllm-ampere-extended container image.
#
# One entry per model. status: validated | smoke-validated | pending.
#   validated       — full gate suite green on the named arch (needle
#                     6-seed aggregate + concurrency; gsm8k-32 counts as
#                     smoke only, false-reds ~1 in 3 at n=32)
#   smoke-validated — boots and generates on the named arch; no perf claim
#   pending         — intended target, not yet run
# Every evidence line cites a CAPTURED transcript file, never hand-written
# prose. Consumers: image README, CI, humans, CI buddies.
- model: qwen3.8-flash
  launch: >-
    vllm serve /models/qwen3.8-flash --max-model-len 150000
    --enable-auto-tool-choice --tool-call-parser qwen3_coder
  status: pending
  evidence: []
- model: glm5.3-flash
  launch: >-
    vllm serve /models/glm5.3-flash --max-model-len 393216
  status: pending
  evidence: []
